name: Build MRS

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "rules/*.txt"
      - ".github/workflows/build-mrs.yml"

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mihomo
        shell: bash
        run: |
          set -e

          echo "正在获取最新 Mihomo 版本..."

          MIHOMO_URL=$(python3 - <<'PY'
          import json
          import re
          import urllib.request

          api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          req = urllib.request.Request(
              api,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          pattern = re.compile(
              r"^mihomo-linux-amd64-v\d+\.\d+\.\d+\.gz$"
          )

          candidates = []

          for asset in data["assets"]:
              name = asset["name"]

              if pattern.match(name):
                  candidates.append(asset["browser_download_url"])

          if not candidates:
              raise SystemExit(
                  "找不到合适的 Mihomo Linux amd64 版本"
              )

          print(candidates[0])
          PY
          )

          echo "下载地址："
          echo "$MIHOMO_URL"

          curl -fL "$MIHOMO_URL" -o mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          sudo mv mihomo /usr/local/bin/mihomo

          echo "Mihomo 版本："
          mihomo -v

      - name: Convert TXT to MRS
        shell: bash
        run: |
          set -e

          for file in rules/*.txt; do

            [ -e "$file" ] || continue

            name=$(basename "$file" .txt)

            echo ""
            echo "========================================"
            echo "正在转换：$file"
            echo "输出文件：rules/$name.mrs"
            echo "========================================"

            mihomo convert-ruleset \
              domain \
              text \
              "$file" \
              "rules/$name.mrs"

            echo "✓ 转换完成：rules/$name.mrs"

          done

      - name: Check generated files
        run: |
          echo "rules 文件夹中的文件："
          ls -lh rules/

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules/*.mrs

          if git diff --cached --quiet; then
            echo "没有新的 MRS 变化"
            exit 0
          fi

          git commit -m "build: update MRS rules"

          git push
